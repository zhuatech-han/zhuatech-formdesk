name: FormDesk verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests and package
        run: mvn -B -f backend/pom.xml spotless:check test package
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run format:check
          npm run lint
          npm test
          npm run build
      - name: Public-source validation
        run: |
          git diff --check
          python3 -m compileall -q scripts
          python3 scripts/release-check.py
      - name: Fresh MySQL and full workflow
        run: |
          python3 scripts/init-env.py
          docker compose -p formdesk-ci config --quiet
          docker compose -p formdesk-ci up -d --build --wait --wait-timeout 240
          python3 scripts/quality.py
          docker compose -p formdesk-ci restart backend
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8142/actuator/health >/dev/null && break; sleep 2; done
          python3 scripts/verify-persistence.py
          python3 scripts/release-check.py
      - name: Cleanup temporary resources
        if: always()
        run: |
          if test -f .env; then docker compose -p formdesk-ci down -v --remove-orphans; fi
